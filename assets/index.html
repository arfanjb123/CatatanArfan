main{max-width:520px;margin:0 auto;padding:18px 16px 96px}
h2{font-size:22px;font-weight:600;margin:4px 0 14px;letter-spacing:-.4px}
h3{font-size:14px;font-weight:600;margin:0 0 8px;color:var(--muted)}
.c{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px;backdrop-filter:blur(14px)}
.hero{background:var(--g);color:#fff;border:0;padding:20px 18px 22px}
.big{font-size:56px;font-weight:300;letter-spacing:-3px;line-height:1.05;margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.b{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.16)}
.m{color:var(--muted)}.k{font-size:12px;color:var(--muted)}.v{font-size:17px;font-weight:600}.v small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chip,.btn,nav button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.chip.on,.btn{background:var(--g);color:#fff;border-color:transparent}
.btn{border-radius:14px;padding:10px 16px}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0}.li>div{flex:1;min-width:0}
.col{flex-direction:column;align-items:stretch;gap:6px}
.x{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 8px}
input,select,textarea{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0;resize:none}
select option{color:#16161a}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
.f{display:flex;gap:8px;margin-top:10px}.f>:first-child{flex:1.4}
.done .t{text-decoration:line-through;color:var(--muted)}
.ai{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ai a{display:block;padding:18px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:600}
.ai a span{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--nav);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav button{flex:1;max-width:80px;border:0;background:none;padding:9px 0;font-size:12px;color:var(--muted);border-radius:12px}
nav button.on{background:var(--g);color:#fff}
nav button{display:grid;place-items:center;padding:11px 0;max-width:64px}
.lg{width:50px;height:50px;border-radius:14px;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.th{display:none;position:absolute;right:16px;top:calc(14px + env(safe-area-inset-top,0px));font-size:18px;background:none;border:0;color:var(--muted);cursor:pointer}
.c{box-shadow:0 10px 28px rgba(0,0,0,.1)}
.hd{display:flex;align-items:center;gap:12px;margin:2px 44px 18px 0}
.brand{font:400 27px/1.15 Pacifico,cursive;color:var(--text)}
.bd{width:42px;height:42px;border-radius:14px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.pg{height:7px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:10px}.pg i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--muted),var(--text))}
.now{border-left:4px solid var(--text)}
.chipd{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.late{background:var(--g);color:#fff;border-color:transparent}
.hero{position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.25)}.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.24),transparent 70%)}.hero>*{position:relative;z-index:1}
.gr{font-size:15px;opacity:.85;margin-top:6px}
@media (prefers-reduced-motion:no-preference){main>*{animation:u .25s ease-out both}@keyframes u{from{opacity:.4;transform:translateY(6px)}}}

<script>
const $=s=>document.querySelector(s);
const D=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const MO=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const N=[0,[420,460],[460,500],[500,540],[540,580],[595,635],[635,675],[675,715],[760,800],[800,840],[840,880],[880,920]];
const U=[0,[470,510],[510,550],[550,590],[605,640],[640,675],[675,710],[755,790],[790,825],[825,860],[860,895],[895,930]];
const BR={n:[[580,595],[715,760]],u:[[590,605],[710,755]]};
const G=(a,b,s,g)=>({a,b,s,g});
let S=null;
try{S=JSON.parse(localStorage.getItem("kelas2")||"null")}catch(e){}
if(!S)S={prof:"n",tasks:[],wa:"",
 sched:{1:[G(1,5,"DPK","Arie"),G(6,7,"Mat","Mei"),G(8,9,"IPAS","Mun"),G(10,11,"BIng","Tunjung")],
 2:[G(1,4,"DPK","Pras"),G(5,6,"BI","Aris"),G(7,7,"BK","Rastri"),G(8,9,"Inf","A. Bambang"),G(10,11,"PPKn","Rahma")],
 3:[G(1,2,"Inf","A. Bambang"),G(3,5,"PAI","Aziz"),G(6,7,"Jawa","Lilis"),G(8,9,"IPAS","Mun"),G(10,11,"Mat","Mei")],
 4:[G(1,3,"OR","Aji"),G(4,5,"Seni","Dyah"),G(6,7,"IPAS","Mun"),G(8,9,"BI","Aris"),G(10,11,"BIng","Tunjung")],
 5:[G(1,3,"DPK","Pras"),G(4,5,"Sejarah","Aini")],6:[]},
 piket:{1:"Zulham, Ryan, Robet, Rizky.A, Chelvy, Noka, Ocha",2:"Risky.H, Prima, Roofed, Maul, Anggun, Clarisa, Terry",3:"Nabil, Kevin, Khoirul, Farel, Tania, Husna, Khoiri",4:"Farhan, Denis, Azkha, Arvin Rizky, Abdullah Khoirul, Suci, Calista",5:"Arvan, Andika, Akhdan, Adi, Avva, Tifani, Lita"}};
const save=()=>{try{localStorage.setItem("kelas2",JSON.stringify(S))}catch(e){}};
let tab="home",day=new Date().getDay()||1,sim={d:null,m:null};
const TABS=[["home","Beranda"],["jadwal","Jadwal"],["piket","Piket"],["tugas","Tugas"],["info","Info"],["ai","AI"]];
const TM=()=>S.prof=="u"?U:N;
const st=b=>TM()[b.a][0],en=b=>TM()[b.b][1];
const hm=m=>String(m/60|0).padStart(2,"0")+"."+String(m%60).padStart(2,"0");
function now(){const n=new Date();return{d:sim.d!=null?sim.d:n.getDay(),m:sim.m!=null?sim.m:n.getHours()*60+n.getMinutes()}}
function stat(d,m){
  const L=(S.sched[d]||[]).slice().sort((x,y)=>x.a-y.a);
  const cur=L.find(b=>m>=st(b)&&m<en(b)),nxt=L.find(b=>st(b)>m);let msg="";
  if(!cur){
    if(!L.length)msg="Tidak ada pelajaran hari ini";
    else if(m<st(L[0]))msg="Belum mulai";
    else if(!nxt)msg="Pelajaran hari ini sudah selesai";
    else msg=BR[S.prof].some(r=>m>=r[0]&&m<r[1])?"Istirahat":"Jam kosong";
  }
  return{cur,nxt,msg}}
function go(t){tab=t;render()}
function theme(){const r=document.documentElement,d=r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");r.dataset.theme=d=="dark"?"light":"dark"}
function tick(){const n=new Date(),p=x=>String(x).padStart(2,"0");const c=$("#clk"),t=$("#dt");
  if(c)c.textContent=p(n.getHours())+":"+p(n.getMinutes())+":"+p(n.getSeconds());
  if(t)t.textContent=D[n.getDay()]+", "+n.getDate()+" "+MO[n.getMonth()]+" "+n.getFullYear();
  if(tab=="home"&&n.getSeconds()==0&&sim.m==null&&sim.d==null)render()}
function prof(p){S.prof=p;save();render()}
function setSim(){const v=$("#sm").value,sd=$("#sd").value;sim.m=v?+v.slice(0,2)*60+ +v.slice(3,5):null;sim.d=sd===""?null:+sd;render()}
function resetSim(){sim={d:null,m:null};render()}
function addS(){const a=+$("#sa").value,b=+$("#sb").value,s=$("#ss").value.trim(),g=$("#sg").value.trim();
  if(!(a>=1&&b>=a&&b<=11)||!s)return $("#ss").focus();
  S.sched[day].push(G(a,b,s,g));S.sched[day].sort((x,y)=>x.a-y.a);save();render()}
function delS(i){S.sched[day].splice(i,1);save();render()}
function setP(d,v){S.piket[d]=v;save()}
function addT(){const t=$("#tt").value.trim();if(!t)return $("#tt").focus();S.tasks.push({t,mp:$("#tm").value.trim(),x:$("#tx").value.trim(),d:$("#td").value,done:false});save();render()}
function togT(i){S.tasks[i].done=!S.tasks[i].done;save();render()}
function delT(i){S.tasks.splice(i,1);save();render()}
function addI(){const x=$("#ix").value.trim();if(!x)return $("#ix").focus();const n=new Date();(S.info=S.info||[]).unshift({x,w:n.getDate()+" "+MO[n.getMonth()]+", "+hm(n.getHours()*60+n.getMinutes())});save();render()}
function delI(i){S.info.splice(i,1);save();render()}
let izin=null;
window.statusIzin=v=>{izin=v;if(tab=="info")render()};
window.masukInfo=a=>{S.info=S.info||[];a.forEach(o=>{if(S.info.some(i=>i.x==o.x))return;const n=new Date(o.k);S.info.unshift({x:o.x,w:n.getDate()+" "+MO[n.getMonth()]+", "+hm(n.getHours()*60+n.getMinutes())})});save();if(tab=="info")render()};
function aktifkan(){const f=$("#fn").value.trim();if(!f)return $("#fn").focus();S.fn=f;save();Kelas.postMessage(JSON.stringify({a:"aktif",f}))}
const notifCard=()=>!window.Kelas?"":`<div class="c"><h3>Baca notifikasi saluran</h3><input id="fn" value="${esc(S.fn||"")}" placeholder="Nama saluran persis seperti di WhatsApp"><div class="f"><button class="btn" style="width:100%" onclick="aktifkan()">${izin?"Simpan nama saluran":"Aktifkan"}</button></div><div class="k" style="margin-top:8px">${izin?"Aktif. Info baru dari saluran masuk otomatis.":"Beri izin akses notifikasi untuk Catatan Arfan, lalu kembali ke aplikasi."}</div></div>`;
function setW(v){S.wa=v.trim();save();render()}
const fd=s=>{if(!s)return"";const d=new Date(s+"T00:00");return d.getDate()+" "+MO[d.getMonth()]};
const byDate=(a,b)=>(a.d||"9")>(b.d||"9")?1:-1;
const jam=b=>"jam "+b.a+(b.b>b.a?"–"+b.b:"");
function view(){
  const{d,m}=now();
  if(tab=="home"){
    const{cur,nxt,msg}=stat(d,m);
    const ln=b=>hm(st(b))+"–"+hm(en(b))+(b.g?", "+esc(b.g):"");
    const isSim=sim.m!=null||sim.d!=null,simT=sim.m!=null?String(sim.m/60|0).padStart(2,"0")+":"+String(sim.m%60).padStart(2,"0"):"";
    const T=S.tasks.map((x,i)=>({...x,i})).filter(x=>!x.done).sort(byDate).slice(0,3);
    return `<div class="c hero"><div class="row"><span id="dt"></span><span class="b">${navigator.onLine?"● Online":"○ Offline"}</span></div><div class="big" id="clk"></div><div class="gr">${gr()}, Arfan</div></div>
<div class="c now"><h3>Pelajaran${isSim?" (simulasi "+D[d]+" "+hm(m)+")":""}</h3>
<div class="k">Sekarang</div>${cur?`<div class="li" style="border:0;padding:6px 0 0"><span class="bd">${ini(cur.s)}</span><div><div class="v">${esc(cur.s)}<small>${jam(cur)}</small></div><div class="k">${ln(cur)}. Selesai ${en(cur)-m} menit lagi</div></div></div><div class="pg"><i style="width:${Math.round((m-st(cur))/(en(cur)-st(cur))*100)}%"></i></div>`:`<div class="v">${msg}</div>`}
<div class="k" style="margin-top:10px">Berikutnya</div>${nxt?`<div class="li" style="border:0;padding:6px 0 0"><span class="bd">${ini(nxt.s)}</span><div><div class="v">${esc(nxt.s)}<small>${jam(nxt)}</small></div><div class="k">${ln(nxt)}. Mulai ${st(nxt)-m} menit lagi</div></div></div>`:'<div class="m">Tidak ada pelajaran lagi.</div>'}</div>
<div class="c"><h3>Piket ${D[d].toLowerCase()}</h3><div>${esc(S.piket[d]||"Belum diisi")}</div></div>
<div class="c"><h3>Tugas terdekat</h3>${T.length?T.map(x=>`<div class="li"><div>${esc(x.t)}${x.mp?`<div class="k">${esc(x.mp)}</div>`:""}</div>${x.d?`<span class="chipd">${dls(x.d)}</span>`:""}</div>`).join(""):'<div class="m">Semua tugas selesai.</div>'}</div>
<div class="c"><h3>Atur jam</h3><div class="chips"><button class="chip ${S.prof=="n"?"on":""}" onclick="prof('n')">Jam normal</button><button class="chip ${S.prof=="u"?"on":""}" onclick="prof('u')">Jam upacara</button></div>
<div class="k">Coba hari dan jam lain, misalnya 12.00</div><div class="f" style="margin-top:6px"><select id="sd" onchange="setSim()"><option value="">Hari ini</option>${[1,2,3,4,5].map(i=>`<option value="${i}" ${sim.d==i?"selected":""}>${D[i]}</option>`).join("")}</select><input id="sm" type="time" value="${simT}" onchange="setSim()"><button class="chip" onclick="resetSim()">Reset</button></div></div>`}
  if(tab=="jadwal"){
    const L=(S.sched[day]||[]).map((b,i)=>({...b,i})).sort((x,y)=>x.a-y.a);
    return `<h2>Jadwal pelajaran</h2><div class="chips">${[1,2,3,4,5,6].map(i=>`<button class="chip ${i==day?"on":""}" onclick="day=${i};render()">${D[i]}</button>`).join("")}</div>
<div class="c">${L.length?L.map(b=>`<div class="li"><span class="bd">${ini(b.s)}</span><div><div class="v">${esc(b.s)}<small>${jam(b)}</small></div><div class="k">${hm(st(b))}–${hm(en(b))}${b.g?", "+esc(b.g):""}</div></div><button class="x" onclick="delS(${b.i})" aria-label="Hapus">×</button></div>`).join(""):'<div class="m">Belum ada pelajaran hari ini. Tambahkan di bawah.</div>'}
<div class="f"><input id="sa" type="number" min="1" max="11" placeholder="Jam ke"><input id="sb" type="number" min="1" max="11" placeholder="Sampai jam"></div>
<div class="f"><input id="ss" placeholder="Mata pelajaran"><input id="sg" placeholder="Guru"></div><div class="f"><button class="btn" style="width:100%" onclick="addS()">Tambah pelajaran</button></div></div>`}
  if(tab=="piket")return `<h2>Jadwal piket</h2><div class="c">${[1,2,3,4,5].map(i=>`<div class="li col"><div class="${i==d?"v":"m"}">${D[i]}</div><textarea rows="2" placeholder="Nama petugas" onchange="setP(${i},this.value)">${esc(S.piket[i]||"")}</textarea></div>`).join("")}</div><div class="c"><h3>Catatan</h3><div>Yang tidak piket wajib membayar uang kas 2 kali.</div></div>`;
  if(tab=="tugas"){
    const T=S.tasks.map((x,i)=>({...x,i})).sort((a,b)=>a.done-b.done||byDate(a,b));
    return `<h2>Daftar tugas</h2><div class="c"><div class="f" style="margin-top:0"><input id="tm" placeholder="Mata pelajaran"><input id="td" type="date" aria-label="Deadline"></div><div class="f"><input id="tt" placeholder="Tugas apa? contoh: Kerjakan soal halaman 45"></div><div class="f"><textarea id="tx" rows="3" placeholder="Detail tugas (opsional)"></textarea></div><div class="f"><button class="btn" style="width:100%" onclick="addT()">Tambah tugas</button></div></div>
<div class="c">${T.length?T.map(x=>`<div class="li ${x.done?"done":""}"><input type="checkbox" style="width:20px;height:20px;flex:none" ${x.done?"checked":""} onchange="togT(${x.i})" aria-label="Selesai"><div><div class="t v">${esc(x.t)}</div>${x.mp?`<div class="k">${esc(x.mp)}</div>`:""}${x.x?`<div class="m" style="margin-top:4px;font-size:13px;white-space:pre-wrap">${esc(x.x)}</div>`:""}</div>${x.d?`<span class="chipd${!x.done&&dl(x.d)<0?" late":""}">${dls(x.d)}</span>`:""}<button class="x" onclick="delT(${x.i})" aria-label="Hapus">×</button></div>`).join(""):'<div class="m">Belum ada tugas.</div>'}</div>`}
  if(tab=="info")return `<h2>Info kelas</h2>${notifCard()}<div class="c"><h3>Info dari saluran</h3>${(S.info||[]).length?S.info.map((x,i)=>`<div class="li"><div style="white-space:pre-wrap">${esc(x.x)}<div class="k">${esc(x.w)}</div></div><button class="x" onclick="delI(${i})" aria-label="Hapus">×</button></div>`).join(""):'<div class="m">Belum ada info.</div>'}<div class="f"><textarea id="ix" rows="3" placeholder="Tempel info dari saluran"></textarea></div><div class="f"><button class="btn" style="width:100%" onclick="addI()">Simpan info</button></div></div><div class="c"><h3>Saluran WhatsApp</h3><input value="${esc(S.wa)}" placeholder="Tempel tautan saluran" onchange="setW(this.value)">${/^https:\/\//.test(S.wa)?`<div class="f"><a class="btn" style="text-decoration:none;text-align:center;flex:1" href="${esc(S.wa)}" target="_blank" rel="noopener">Buka saluran</a></div>`:'<div class="m" style="margin-top:10px">Tempel tautan saluran untuk membukanya dari sini.</div>'}</div>`;
  return `<h2>Pintasan AI</h2><div class="ai">${[["ChatGPT","chatgpt.com","OpenAI"],["Gemini","gemini.google.com","Google"],["Meta AI","www.meta.ai","Meta"],["Claude","claude.ai","Anthropic"],["Copilot","copilot.microsoft.com","Microsoft"],["Perplexity","www.perplexity.ai","Pencarian"]].map(a=>`<a href="https://${a[1]}" target="_blank" rel="noopener">${a[0]}<span>${a[2]}</span></a>`).join("")}</div>`}

const dl=s=>Math.round((new Date(s+"T00:00")-new Date(new Date().toDateString()))/864e5);
const dls=s=>{const n=dl(s);return n<0?"Terlambat":n==0?"Hari ini":n==1?"Besok":n+" hari lagi"};
