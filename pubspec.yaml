name: catatan_arfan
description: Catatan Arfan, aplikasi kelas pribadi
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.9.0
  flutter_notification_listener: ^1.3.3
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.0
flutter:
  uses-material-design: true
  assets:
    - assets/index.html
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icon_fg.png
